name: Validate chatai

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  syntax-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile main.py
      - run: python -m unittest discover -s tests -v
      - run: python -c "import main; print('chatai import OK')"
      - name: Build Docker image
        run: docker build -t chatai-port-test .
      - name: Smoke-test the HTTP port
        shell: bash
        run: |
          docker run -d --name chatai-port-test -p 10000:10000 -e PORT=10000 -e DATA_DIR=/tmp/chatai-ci-data chatai-port-test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:10000/livez; then
              echo
              docker rm -f chatai-port-test
              exit 0
            fi
            sleep 2
          done
          docker logs chatai-port-test
          docker rm -f chatai-port-test || true
          exit 1
