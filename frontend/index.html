<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatStudio</title>
<style>
:root{--bg:#f7f6f2;--side:#eeece6;--panel:#fff;--text:#20201e;--muted:#77756e;--border:#dedbd3;--accent:#d97757}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.sidebar{padding:18px 14px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:12px}.brand{padding:8px 10px 18px;font-size:20px;font-weight:700}
.new-chat{border:0;border-radius:12px;background:var(--text);color:#fff;padding:11px 14px;cursor:pointer}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer}.nav button:hover,.chat-item:hover{background:rgba(0,0,0,.05)}
.history{min-height:0;overflow:auto;flex:1}.history-title{color:var(--muted);font-size:12px;padding:8px 10px}.chat-item{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.topbar{height:64px;padding:0 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(247,246,242,.86);backdrop-filter:blur(10px)}.chat-title{font-weight:650}.model-label{color:var(--muted);font-size:13px}
.messages{flex:1;width:min(900px,100%);margin:auto;padding:32px 24px 150px}.empty{min-height:calc(100vh - 170px);display:grid;place-items:center;color:var(--muted);text-align:center}.composer-wrap{position:fixed;left:270px;right:0;bottom:0;padding:16px 24px 24px;background:linear-gradient(transparent,var(--bg) 28%)}.composer{width:min(900px,100%);margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:0 8px 35px rgba(0,0,0,.06)}.composer textarea{width:100%;resize:none;border:0;outline:0;background:transparent;min-height:48px;max-height:180px;padding:6px 8px}.composer-actions{display:flex;justify-content:flex-end}.send{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:8px 15px;cursor:pointer}
.auth{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.24);padding:20px}.auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.15)}.auth-card input{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:10px}.auth-card button{width:100%;border:0;border-radius:10px;padding:11px;background:var(--text);color:#fff}.auth-switch{margin-top:12px;color:var(--muted);font-size:13px;text-align:center;cursor:pointer}.error{color:#a63b2c;font-size:13px;margin-top:10px}.message{margin:0 0 26px;white-space:pre-wrap;line-height:1.65}.message.user{margin-left:auto;max-width:78%;background:#ebe8df;border-radius:16px;padding:12px 15px}.message.assistant{max-width:90%}.message-role{font-size:12px;color:var(--muted);margin-bottom:5px}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.composer-wrap{left:0;padding:10px}.messages{padding-left:14px;padding-right:14px}.topbar{padding:0 14px}}
</style></head><body>
<div id="app" class="app" hidden><aside class="sidebar"><div class="brand">ChatStudio</div><button id="newChat" class="new-chat">＋ Новый чат</button><nav class="nav"><button>⌕ Поиск</button><button>▱ Файлы</button><button>⚙ Настройки</button></nav><div class="history"><div class="history-title">История</div><div id="historyList"></div></div><nav class="nav"><button>Аккаунт</button><button id="logoutBtn">Выйти</button></nav></aside>
<main class="main"><header class="topbar"><div id="chatTitle" class="chat-title">Новый чат</div><div class="model-label">AI Router</div></header><section id="messages" class="messages"><div class="empty"><div><h2>Добро пожаловать в ChatStudio</h2><div>Создайте новый приватный чат и начните разговор.</div></div></div></section><div class="composer-wrap"><form id="composer" class="composer"><textarea id="messageInput" placeholder="Напишите сообщение..." rows="1"></textarea><div class="composer-actions"><button type="button" id="stopBtn" class="send" style="display:none">Остановить</button><button class="send" id="sendBtn">Отправить</button></div></form></div></main></div>
<div id="auth" class="auth"><form id="authForm" class="auth-card"><h1 id="authTitle">Вход</h1><input id="authName" placeholder="Имя" autocomplete="name" hidden><input id="authEmail" type="email" placeholder="Email" autocomplete="email" required><input id="authPassword" type="password" placeholder="Пароль" required><button>Продолжить</button><div id="authError" class="error"></div><div id="authSwitch" class="auth-switch">Нет аккаунта? Зарегистрироваться</div></form></div>
<script>
let currentChatId=null,registerMode=false,activeRequestId=null,streamReader=null;const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"Ошибка запроса");return d}
async function checkAuth(){try{await api("/api/auth/me");$("auth").style.display="none";$("app").hidden=false;await loadChats()}catch{$("app").hidden=true;$("auth").style.display="grid"}}
async function loadChats(){const d=await api("/api/chats"),list=$("historyList");list.innerHTML="";d.chats.forEach(c=>{const b=document.createElement("button");b.className="chat-item";b.textContent=c.title;b.onclick=()=>openChat(c.id);list.appendChild(b)})}
async function createChat(){const d=await api("/api/chats",{method:"POST",body:JSON.stringify({title:"Новый чат"})});currentChatId=d.chat.id;$("chatTitle").textContent=d.chat.title;$("messages").innerHTML='<div class="empty"><div>Напишите первое сообщение.</div></div>';await loadChats();$("messageInput").focus()}
async function openChat(id){const d=await api("/api/chats/"+id);currentChatId=id;$("chatTitle").textContent=d.chat.title;render(d.messages)}
function render(ms){const root=$("messages");root.innerHTML="";if(!ms.length){root.innerHTML='<div class="empty"><div>Напишите первое сообщение.</div></div>';return}ms.forEach(m=>{const a=document.createElement("article");a.className="message "+m.role;const r=document.createElement("div");r.className="message-role";r.textContent=m.role==="user"?"Вы":"ChatStudio";a.appendChild(r);const b=document.createElement("div");b.textContent=m.content;a.appendChild(b);root.appendChild(a)})}
function setGenerating(value){$("sendBtn").style.display=value?"none":"";$("stopBtn").style.display=value?"":"none";$("messageInput").disabled=value}
function addLiveAssistant(){const root=$("messages");const empty=root.querySelector(".empty");if(empty)empty.remove();const a=document.createElement("article");a.className="message assistant";const r=document.createElement("div");r.className="message-role";r.textContent="ChatStudio";a.appendChild(r);const b=document.createElement("div");b.className="live-content";a.appendChild(b);root.appendChild(a);root.scrollTop=root.scrollHeight;return b}
async function send(content){if(!currentChatId)await createChat();setGenerating(true);activeRequestId=null;const live=addLiveAssistant();try{const response=await fetch("/api/requests/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:currentChatId,content})});if(!response.ok){const d=await response.json().catch(()=>({}));throw Error(d.detail||"Ошибка запроса")}streamReader=response.body.getReader();const decoder=new TextDecoder();let buffer="";while(true){const {value,done}=await streamReader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const parts=buffer.split("\n\n");buffer=parts.pop();for(const part of parts){const line=part.split("\n").find(x=>x.startsWith("data:"));if(!line)continue;const data=JSON.parse(line.slice(5).trim());if(data.type==="start"){activeRequestId=data.request_id}else if(data.type==="delta"){live.textContent+=data.content;rootScroll()}else if(data.type==="fallback"){live.textContent="";rootScroll()}else if(data.type==="cancelled"){live.textContent+="\n\n[Запрос отменён]";return}else if(data.type==="error"){throw Error(data.error||"Запрос не выполнен")}else if(data.type==="complete"){if(data.message)live.textContent=data.message.content;$("chatTitle").textContent=(await api("/api/chats/"+currentChatId)).chat.title;await loadChats();return}}}}finally{streamReader=null;activeRequestId=null;setGenerating(false)}}
function rootScroll(){const root=$("messages");root.scrollTop=root.scrollHeight}
async function stopGeneration(){if(!activeRequestId)return;try{await api("/api/requests/"+activeRequestId+"/cancel",{method:"POST"})}catch(x){console.error(x)}}
$("newChat").onclick=createChat;$("stopBtn").onclick=stopGeneration;$("composer").onsubmit=async e=>{e.preventDefault();const i=$("messageInput"),c=i.value.trim();if(!c)return;i.value="";try{await send(c)}catch(x){alert(x.message)}};
$("authSwitch").onclick=()=>{registerMode=!registerMode;$("authTitle").textContent=registerMode?"Регистрация":"Вход";$("authName").hidden=!registerMode;$("authName").required=registerMode;$("authSwitch").textContent=registerMode?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться"};
$("authForm").onsubmit=async e=>{e.preventDefault();const p={email:$("authEmail").value,password:$("authPassword").value};if(registerMode)p.name=$("authName").value;try{await api(registerMode?"/api/auth/register":"/api/auth/login",{method:"POST",body:JSON.stringify(p)});await checkAuth()}catch(x){$("authError").textContent=x.message}};
$("logoutBtn").onclick=async()=>{await api("/api/auth/logout",{method:"POST"});currentChatId=null;await checkAuth()};
$("messageInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}};checkAuth();
</script></body></html>
