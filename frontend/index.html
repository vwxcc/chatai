<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatStudio</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.css"><script defer src="https://cdn.jsdelivr.net/npm/marked@16.3.0/marked.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.2.6/dist/purify.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.25/dist/contrib/auto-render.min.js"></script>
<style>
:root{--bg:#f7f6f2;--side:#eeece6;--panel:#fff;--text:#20201e;--muted:#77756e;--border:#dedbd3;--accent:#d97757}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
.app{min-height:100vh;display:grid;grid-template-columns:270px 1fr}.sidebar{padding:18px 14px;background:var(--side);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:12px}.brand{padding:8px 10px 18px;font-size:20px;font-weight:700}
.new-chat{border:0;border-radius:12px;background:var(--text);color:#fff;padding:11px 14px;cursor:pointer}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;cursor:pointer}.nav button:hover,.chat-item:hover{background:rgba(0,0,0,.05)}
.history{min-height:0;overflow:auto;flex:1}.history-title{color:var(--muted);font-size:12px;padding:8px 10px}.chat-item{width:100%;border:0;background:transparent;text-align:left;padding:9px 10px;border-radius:9px;cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.main{min-width:0;display:flex;flex-direction:column;min-height:100vh}.topbar{height:64px;padding:0 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;background:rgba(247,246,242,.86);backdrop-filter:blur(10px)}.chat-title{font-weight:650}.model-label{color:var(--muted);font-size:13px}
.messages{flex:1;width:min(900px,100%);margin:auto;padding:32px 24px 150px}.empty{min-height:calc(100vh - 170px);display:grid;place-items:center;color:var(--muted);text-align:center}.composer-wrap{position:fixed;left:270px;right:0;bottom:0;padding:16px 24px 24px;background:linear-gradient(transparent,var(--bg) 28%)}.composer{width:min(900px,100%);margin:auto;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:12px;box-shadow:0 8px 35px rgba(0,0,0,.06)}.composer textarea{width:100%;resize:none;border:0;outline:0;background:transparent;min-height:48px;max-height:180px;padding:6px 8px}.attachments{display:flex;gap:7px;flex-wrap:wrap;padding:4px 6px 8px}.file-chip{display:flex;align-items:center;gap:6px;background:#f0eee8;border:1px solid var(--border);border-radius:9px;padding:5px 8px;font-size:12px}.file-chip button{border:0;background:transparent;cursor:pointer;color:var(--muted)}.attach{border:1px solid var(--border);background:transparent;border-radius:9px;padding:7px 10px;cursor:pointer}.composer-actions{display:flex;justify-content:space-between;align-items:center}.send{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:8px 15px;cursor:pointer}
.auth{position:fixed;inset:0;display:none;place-items:center;background:rgba(0,0,0,.24);padding:20px}.auth-card{width:min(420px,100%);background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 20px 70px rgba(0,0,0,.15)}.auth-card input{width:100%;border:1px solid var(--border);border-radius:10px;padding:11px 12px;margin-bottom:10px}.auth-card button{width:100%;border:0;border-radius:10px;padding:11px;background:var(--text);color:#fff}.auth-switch{margin-top:12px;color:var(--muted);font-size:13px;text-align:center;cursor:pointer}.error{color:#a63b2c;font-size:13px;margin-top:10px}.message{margin:0 0 26px;line-height:1.65}.message-body{overflow-wrap:anywhere}.message-body p{margin:0 0 12px}.message-body p:last-child{margin-bottom:0}.message-body h1,.message-body h2,.message-body h3{margin:18px 0 9px;line-height:1.25}.message-body ul,.message-body ol{padding-left:24px}.message-body li{margin:4px 0}.message-body blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid var(--border);color:var(--muted)}.message-body table{border-collapse:collapse;width:100%;margin:12px 0;display:block;overflow:auto}.message-body th,.message-body td{border:1px solid var(--border);padding:7px 9px;text-align:left}.message-body code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.9em;background:rgba(0,0,0,.055);padding:2px 5px;border-radius:5px}.message-body pre{position:relative;margin:12px 0;padding:14px 46px 14px 14px;background:#20201e;color:#f7f6f2;border-radius:10px;overflow:auto}.message-body pre code{background:transparent;padding:0;color:inherit}.code-copy{position:absolute;top:8px;right:8px;border:0;border-radius:7px;padding:5px 8px;cursor:pointer;background:rgba(255,255,255,.12);color:#fff}.katex-display{overflow:auto;padding:4px 0}.user .message-body code{background:rgba(0,0,0,.07)}.message.user{margin-left:auto;max-width:78%;background:#ebe8df;border-radius:16px;padding:12px 15px}.message.assistant{max-width:90%}.message-role{font-size:12px;color:var(--muted);margin-bottom:5px}
@media(max-width:760px){.app{grid-template-columns:1fr}.sidebar{display:none}.composer-wrap{left:0;padding:10px}.messages{padding-left:14px;padding-right:14px}.topbar{padding:0 14px}}
</style></head><body>
<div id="app" class="app" hidden><aside class="sidebar"><div class="brand">ChatStudio</div><button id="newChat" class="new-chat">＋ Новый чат</button><nav class="nav"><button>⌕ Поиск</button><button>▱ Файлы</button><button>⚙ Настройки</button></nav><div class="history"><div class="history-title">История</div><div id="historyList"></div></div><nav class="nav"><button>Аккаунт</button><button id="logoutBtn">Выйти</button></nav></aside>
<main class="main"><header class="topbar"><div id="chatTitle" class="chat-title">Новый чат</div><div class="model-label">AI Router</div></header><section id="messages" class="messages"><div class="empty"><div><h2>Добро пожаловать в ChatStudio</h2><div>Создайте новый приватный чат и начните разговор.</div></div></div></section><div class="composer-wrap"><form id="composer" class="composer"><input id="fileInput" type="file" multiple hidden accept=".pdf,.docx,.txt,.md,.csv,.xls,.xlsx,.ppt,.pptx,.json,.xml,.zip,.png,.jpg,.jpeg,.gif,.webp"><div id="attachments" class="attachments"></div><textarea id="messageInput" placeholder="Напишите сообщение..." rows="1"></textarea><div class="composer-actions"><button type="button" id="attachBtn" class="attach">＋ Файл</button><div><button type="button" id="stopBtn" class="send" style="display:none">Остановить</button><button class="send" id="sendBtn">Отправить</button></div></form></div></main></div>
<div id="auth" class="auth"><form id="authForm" class="auth-card"><h1 id="authTitle">Вход</h1><input id="authName" placeholder="Имя" autocomplete="name" hidden><input id="authEmail" type="email" placeholder="Email" autocomplete="email" required><input id="authPassword" type="password" placeholder="Пароль" required><button>Продолжить</button><div id="authError" class="error"></div><div id="authSwitch" class="auth-switch">Нет аккаунта? Зарегистрироваться</div></form></div>
<script>
let currentChatId=null,registerMode=false,activeRequestId=null,streamReader=null,selectedFiles=[];const $=id=>document.getElementById(id);
async function api(path,options={}){const r=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"Ошибка запроса");return d}
async function checkAuth(){try{await api("/api/auth/me");$("auth").style.display="none";$("app").hidden=false;await loadChats()}catch{$("app").hidden=true;$("auth").style.display="grid"}}
async function loadChats(){const d=await api("/api/chats"),list=$("historyList");list.innerHTML="";d.chats.forEach(c=>{const b=document.createElement("button");b.className="chat-item";b.textContent=c.title;b.onclick=()=>openChat(c.id);list.appendChild(b)})}
function formatBytes(n){if(n<1024)return n+" Б";if(n<1024*1024)return (n/1024).toFixed(1)+" КБ";return (n/1024/1024).toFixed(1)+" МБ"}
function renderSelectedFiles(){const root=$("attachments");root.innerHTML="";selectedFiles.forEach((f,i)=>{const chip=document.createElement("div");chip.className="file-chip";chip.textContent=f.filename+" · "+formatBytes(f.size);const b=document.createElement("button");b.type="button";b.textContent="×";b.onclick=()=>{selectedFiles.splice(i,1);renderSelectedFiles()};chip.appendChild(b);root.appendChild(chip)})}
async function uploadSelected(list){for(const file of list){const fd=new FormData();fd.append("file",file);const r=await fetch("/api/files",{method:"POST",body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.detail||"Не удалось загрузить файл");selectedFiles.push(d.file)}renderSelectedFiles()}
async function createChat(){selectedFiles=[];renderSelectedFiles();const d=await api("/api/chats",{method:"POST",body:JSON.stringify({title:"Новый чат"})});currentChatId=d.chat.id;$("chatTitle").textContent=d.chat.title;$("messages").innerHTML='<div class="empty"><div>Напишите первое сообщение.</div></div>';await loadChats();$("messageInput").focus()}
async function openChat(id){const d=await api("/api/chats/"+id);currentChatId=id;$("chatTitle").textContent=d.chat.title;render(d.messages)}
function renderMarkdown(text){const raw=typeof marked!=="undefined"?marked.parse(text,{breaks:true,gfm:true}):String(text).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));return typeof DOMPurify!=="undefined"?DOMPurify.sanitize(raw):raw}
function typeset(root){if(typeof renderMathInElement==="function"){try{renderMathInElement(root,{delimiters:[{left:"$",right:"$",display:true},{left:"\\\\[",right:"\\\\]",display:true},{left:"$",right:"$",display:false},{left:"\\\\(",right:"\\\\)",display:false}],throwOnError:false})}catch(e){console.warn("KaTeX:",e)}}root.querySelectorAll("pre code").forEach(code=>{const pre=code.parentElement;if(pre.querySelector(".code-copy"))return;const b=document.createElement("button");b.className="code-copy";b.textContent="Копировать";b.onclick=async()=>{try{await navigator.clipboard.writeText(code.textContent);b.textContent="Скопировано";setTimeout(()=>b.textContent="Копировать",1200)}catch(e){}};pre.appendChild(b)})}
function setMessageContent(el,text){el.innerHTML=renderMarkdown(text);typeset(el)}
function render(ms){const root=$("messages");root.innerHTML="";if(!ms.length){root.innerHTML='<div class="empty"><div>Напишите первое сообщение.</div></div>';return}ms.forEach(m=>{const a=document.createElement("article");a.className="message "+m.role;const r=document.createElement("div");r.className="message-role";r.textContent=m.role==="user"?"Вы":"ChatStudio";a.appendChild(r);const b=document.createElement("div");b.className="message-body";setMessageContent(b,m.content);a.appendChild(b);if(m.files&&m.files.length){const files=document.createElement("div");files.className="attachments";m.files.forEach(f=>{const chip=document.createElement("a");chip.className="file-chip";chip.href="/api/files/"+f.id+"/download";chip.target="_blank";chip.rel="noopener";chip.textContent=f.filename+" · "+formatBytes(f.size);files.appendChild(chip)});a.appendChild(files)}root.appendChild(a)})}
function setGenerating(value){$("sendBtn").style.display=value?"none":"";$("stopBtn").style.display=value?"":"none";$("messageInput").disabled=value}
function addLiveAssistant(){const root=$("messages");const empty=root.querySelector(".empty");if(empty)empty.remove();const a=document.createElement("article");a.className="message assistant";const r=document.createElement("div");r.className="message-role";r.textContent="ChatStudio";a.appendChild(r);const b=document.createElement("div");b.className="live-content";a.appendChild(b);root.appendChild(a);root.scrollTop=root.scrollHeight;return b}
async function send(content){if(!currentChatId)await createChat();setGenerating(true);activeRequestId=null;const live=addLiveAssistant();let liveText="";try{const response=await fetch("/api/requests/stream",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({chat_id:currentChatId,content,file_ids:selectedFiles.map(f=>f.id)})});if(!response.ok){const d=await response.json().catch(()=>({}));throw Error(d.detail||"Ошибка запроса")}streamReader=response.body.getReader();const decoder=new TextDecoder();let buffer="";while(true){const {value,done}=await streamReader.read();if(done)break;buffer+=decoder.decode(value,{stream:true});const parts=buffer.split("\n\n");buffer=parts.pop();for(const part of parts){const line=part.split("\n").find(x=>x.startsWith("data:"));if(!line)continue;const data=JSON.parse(line.slice(5).trim());if(data.type==="start"){activeRequestId=data.request_id}else if(data.type==="delta"){liveText+=data.content;setMessageContent(live,liveText);rootScroll()}else if(data.type==="fallback"){liveText="";setMessageContent(live,liveText);rootScroll()}else if(data.type==="cancelled"){liveText+="\n\n[Запрос отменён]";setMessageContent(live,liveText);return}else if(data.type==="error"){throw Error(data.error||"Запрос не выполнен")}else if(data.type==="complete"){if(data.message){liveText=data.message.content;setMessageContent(live,liveText)}selectedFiles=[];renderSelectedFiles();$("chatTitle").textContent=(await api("/api/chats/"+currentChatId)).chat.title;await loadChats();return}}}}finally{streamReader=null;activeRequestId=null;setGenerating(false)}}
function rootScroll(){const root=$("messages");root.scrollTop=root.scrollHeight}
async function stopGeneration(){if(!activeRequestId)return;try{await api("/api/requests/"+activeRequestId+"/cancel",{method:"POST"})}catch(x){console.error(x)}}
$("attachBtn").onclick=()=>$("fileInput").click();$("fileInput").onchange=async e=>{try{await uploadSelected(e.target.files)}catch(x){alert(x.message)}finally{e.target.value=""}};$("newChat").onclick=createChat;$("stopBtn").onclick=stopGeneration;$("composer").onsubmit=async e=>{e.preventDefault();const i=$("messageInput"),c=i.value.trim();if(!c&&!selectedFiles.length)return;i.value="";try{await send(c)}catch(x){alert(x.message)}};
$("authSwitch").onclick=()=>{registerMode=!registerMode;$("authTitle").textContent=registerMode?"Регистрация":"Вход";$("authName").hidden=!registerMode;$("authName").required=registerMode;$("authSwitch").textContent=registerMode?"Уже есть аккаунт? Войти":"Нет аккаунта? Зарегистрироваться"};
$("authForm").onsubmit=async e=>{e.preventDefault();const p={email:$("authEmail").value,password:$("authPassword").value};if(registerMode)p.name=$("authName").value;try{await api(registerMode?"/api/auth/register":"/api/auth/login",{method:"POST",body:JSON.stringify(p)});await checkAuth()}catch(x){$("authError").textContent=x.message}};
$("logoutBtn").onclick=async()=>{await api("/api/auth/logout",{method:"POST"});currentChatId=null;await checkAuth()};
$("messageInput").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();$("composer").requestSubmit()}};checkAuth();
</script></body></html>
