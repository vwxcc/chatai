services:
  - type: web
    name: chatai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: ALLOWED_USER_IDS
        sync: false
      - key: ARCHIVE_CHANNEL_ID
        sync: false

      - key: AI_API_KEY
        sync: false
      - key: AI_API_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: AI_API_PATH
        value: /chat/completions
      - key: AI_API_MODE
        value: openai_chat
      - key: AI_MODEL
        value: openrouter/free
      - key: AI_FALLBACK_MODELS
        value: ""
      - key: AI_AUTH_HEADER
        value: Authorization
      - key: AI_AUTH_PREFIX
        value: "Bearer "
      - key: AI_EXTRA_HEADERS_JSON
        value: "{}"
      - key: AI_REQUEST_TEMPLATE_JSON
        value: ""
      - key: AI_RESPONSE_TEXT_PATH
        value: choices.0.message.content
      - key: AI_MAX_TOKENS
        value: "7000"
      - key: AI_TEMPERATURE
        value: "0.3"
      - key: AI_TIMEOUT
        value: "180"
      - key: AI_CONCURRENCY
        value: "2"

      - key: TTS_API_KEY
        sync: false
      - key: TTS_API_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: TTS_API_PATH
        value: /audio/speech
      - key: TTS_API_MODE
        value: openai_speech
      - key: TTS_MODEL
        value: fish-audio/s2.1-pro-free:free
      - key: TTS_FALLBACK_MODELS
        value: ""
      - key: TTS_AUTH_HEADER
        value: Authorization
      - key: TTS_AUTH_PREFIX
        value: "Bearer "
      - key: TTS_EXTRA_HEADERS_JSON
        value: "{}"
      - key: TTS_REQUEST_TEMPLATE_JSON
        value: ""
      - key: TTS_RESPONSE_MODE
        value: raw_audio
      - key: TTS_RESPONSE_AUDIO_PATH
        value: audio
      - key: TTS_RESPONSE_URL_PATH
        value: audio_url
      - key: TTS_VOICE_FIELD
        value: ""
      - key: TTS_SPEED_FIELD
        value: ""
      - key: TTS_FORMAT_FIELD
        value: response_format
      - key: TTS_AUDIO_FORMAT
        value: mp3
      - key: TTS_DEFAULT_VOICE
        value: ""
      - key: TTS_DEFAULT_SPEED
        value: "1.0"
      - key: TTS_CHUNK_CHARS
        value: "2600"
      - key: TTS_MAX_CHARS
        value: "24000"
      - key: TTS_TIMEOUT
        value: "180"

      - key: DATA_DIR
        value: /tmp/chatai-data
      - key: WEBHOOK_SECRET
        generateValue: true
